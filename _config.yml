# Site settings
title: Ts. Recorder # site title
description: >- # site description
  Competitive Pokémon teams, recorded.
about: |- # site about
  This project consists of a minimalist blog built with Jekyll and based on the <a href="https://github.com/piharpi/jekyll-klise" target="_blank">Klisé theme</a>, with light and dark mode support.  
  You can find this project's source code on <a href="https://github.com/tsrecorder/tsrecorder.github.io" target="_blank">Github</a>.
lang: en-US # default lang
timezone: Europe/Lisbon # set your timezone
image: assets/img/avatar.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/tsrecorder/tsrecorder.github.io # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: r0da # author name
  bio: |-
    Hello, I'm r0da, a software developer and competitive Pokémon enthusiast.

    I started this blog to document the teams shaping the metagame. Each post breaks down a popular team providing the Pokémon sets, the gameplan and common leads.  
    I wanted a database of teams I could open right before a match to get a quick overview of the opposing team and its weaknesses. I hope you find it useful too!
  username: tsrecorder # general username
  github: tsrecorder # github username
  twitter: tsrecorder2026 # twitter username
  instagram: tsrecorder2026 # instagram username
  bluesky: tsrecorder2026.bsky.social # bluesky username
  email: tsrecorder@proton.me # email adress
  avatar: /assets/img/avatar.png # avatar image path

# URL settings
url: "https://tsrecorder.github.io" #
baseurl:
permalink:
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap